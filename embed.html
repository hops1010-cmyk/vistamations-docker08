<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#0b1115"><title>VISTAMATIONS · Embed</title>
<style>:root{color-scheme:dark;font:14px/1.5 "Segoe UI",Arial,sans-serif;background:#0b1115;color:#edf2ec;--lime:#c9ff63;--gold:#f4b84a}*{box-sizing:border-box}html,body{width:100%;height:100%;margin:0}.page{height:100%;display:flex;flex-direction:column;overflow:hidden;background:#0b1115}.bar{min-height:52px;display:flex;align-items:center;justify-content:space-between;gap:1rem;padding:.55rem 1rem;background:linear-gradient(110deg,#162127,#11191e 68%,#1e2820);border-bottom:1px solid #40504b}.brand{color:var(--lime);font-size:.68rem;font-weight:800;letter-spacing:.16em}.name{margin-left:.7rem;color:#edf2ec;font-size:.95rem;letter-spacing:0;overflow-wrap:anywhere}.links{display:flex;align-items:center;gap:.8rem;white-space:nowrap}.links a{font-size:.78rem;font-weight:700;text-decoration:none}.links a:hover{text-decoration:underline}.back{color:var(--gold)}.edit{color:var(--lime)}iframe{display:block;flex:1;width:100%;min-height:0;border:0;background:#10171b}.fail{display:none;flex:1;align-items:center;justify-content:center;padding:2rem;color:#a5b4b0;text-align:center}.fail.show{display:flex}.fail a{color:var(--lime)}@media(max-width:520px){.bar{min-height:44px;padding:.45rem .65rem;font-size:.78rem}.name{display:block;margin:.1rem 0 0}}</style>
</head>
<body><div class="page"><header class="bar"><div><span class="brand">VISTAMATIONS</span><span class="name" id="slug-name">Embed</span></div><div class="links"><a class="edit" id="edit-link" href="#" target="_blank" rel="noopener noreferrer">Edit ↗</a><a class="back" href="/">← Portfolio</a></div></header>
<iframe id="frame" title="Perchance generator" referrerpolicy="no-referrer" allow="clipboard-read; clipboard-write; fullscreen" allowfullscreen></iframe>
<div class="fail" id="fail"><div><p>The generator did not load. It may be private, renamed, or deleted.</p><p><a href="#" id="fail-link" target="_blank" rel="noopener noreferrer">Open directly on Perchance ↗</a></p></div></div>
</div>
<script>
// Generic embed page: reads ?slug=<full-slug> from the URL and embeds from
// https://null.perchance.org/<slug>. Generator URLs always use the full slug
// (e.g. "https---perchance-org-player-metal") — never strip the prefix.
(function () {
  var params = new URLSearchParams(window.location.search);
  var rawSlug = params.get('slug');
  var slug = (rawSlug || '').trim();
  var nameEl = document.getElementById('slug-name');
  var titleEl = document.getElementById('fail-link');
  var editLink = document.getElementById('edit-link');
  var failLink = document.getElementById('fail-link');
  var frame = document.getElementById('frame');
  var fail = document.getElementById('fail');
  if (!slug || !/^[a-z0-9-]{1,100}$/.test(slug)) {
    document.title = 'VISTAMATIONS · Embed';
    nameEl.textContent = 'Add ?slug=<generator-slug> to the URL';
    frame.style.display = 'none';
    fail.style.display = 'none';
    return;
  }
  var embedSrc = 'https://null.perchance.org/' + slug;
  var editorHref = 'https://perchance.org/' + slug + '#edit';
  document.title = 'VISTAMATIONS \u00b7 ' + slug;
  nameEl.textContent = slug;
  editLink.href = editorHref;
  failLink.href = embedSrc;
  failLink.textContent = 'Open ' + slug + ' directly on Perchance ↗';
  frame.title = slug + ' Perchance generator';
  frame.src = embedSrc;
  var done = false;
  function loaded() { done = true; }
  frame.addEventListener('load', loaded);
  frame.addEventListener('error', function () { if (!done) fail.classList.add('show'); });
  setTimeout(function () { if (!done) fail.classList.add('show'); }, 12000);
})();
</script>
</body></html>
